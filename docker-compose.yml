version: '3.8'

services:
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "127.0.0.1:7050:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data

  events-db:
    image: postgres:16-alpine
    container_name: events-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events_db
    ports:
      - "127.0.0.1:7051:5432"
    volumes:
      - events_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 3s
      timeout: 3s
      retries: 5
  
  bookings-db:
    image: postgres:16-alpine
    container_name: bookings-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookings_db
    ports:
      - "127.0.0.1:7052:5432"
    volumes:
      - bookings_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookings_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  users-service:
    image: users-service:latest
    build:
      context: .
      dockerfile: EventBroker.Services/Users/Presentation/Dockerfile
    container_name: users-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=users-db;Port=5432;Database=users_db;Username=postgres;Password=postgres
    depends_on:
      - users-db

  events-service:
    image: events-service:latest
    build:
      context: .
      dockerfile: EventBroker.Services/Events/Presentation/Dockerfile
    container_name: events-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=events-db;Port=5432;Database=events_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__GroupId=events-service-group
    depends_on:
      events-db:
        condition: service_healthy 
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  bookings-service:
    image: bookings-service:latest
    build:
      context: .
      dockerfile: EventBroker.Services/Bookings/Presentation/Dockerfile
    container_name: bookings-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=bookings-db;Port=5432;Database=bookings_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__GroupId=bookings-service-group
    depends_on:
      bookings-db:
        condition: service_healthy 
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    image: api-gateway:latest
    build:
      context: .
      dockerfile: EventBroker.API/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      users-service:
        condition: service_started
      events-service:
        condition: service_started
      bookings-service:
        condition: service_started

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: [ '/bin/bash', '-c' ]
    command:
      - |
        cub kafka-ready 1 40 -b kafka:29092 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic event-booking --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic event-integration --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic booking-processing --partitions 1 --replication-factor 1 &&
        echo 'All topics created successfully.'

volumes:
  users_db_data:
  events_db_data:
  bookings_db_data:

